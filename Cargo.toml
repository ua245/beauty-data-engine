[workspace]
resolver = "2"
members = [
    "crates/halal-core",
    "crates/halal-scraper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ua245/beauty-data-engine"

[workspace.dependencies]
halal-core = { path = "crates/halal-core" }

anyhow = "1.0"
clap = { version = "=4.5.23", features = ["derive"] }
reqwest = { version = "=0.12.9", default-features = false, features = ["rustls-tls", "gzip", "json"] }
scraper = "=0.21.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
regex = "1.11"
once_cell = "1.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "fs", "time", "signal"] }
unicode-normalization = "0.1"
sha2 = "=0.10.8"
hex = "0.4"
url = "2.5"
strsim = "0.11"
indexmap = { version = "=2.7.1", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
