[package]
name = "halal-scraper"
description = "Retailer connectors and catalog export for the halal beauty engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "halal-scraper"
path = "src/main.rs"

[dependencies]
halal-core.workspace = true
anyhow.workspace = true
clap.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true

[features]
default = []
live = ["dep:reqwest", "dep:scraper", "dep:url"]

[dependencies.reqwest]
workspace = true
optional = true

[dependencies.scraper]
workspace = true
optional = true

[dependencies.url]
workspace = true
optional = true
