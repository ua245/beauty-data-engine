services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: halal
      POSTGRES_PASSWORD: halal
      POSTGRES_DB: halal_beauty
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: dev-master-key
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://halal:halal@postgres:5432/halal_beauty
      REDIS_URL: redis://redis:6379
      MEILI_URL: http://meilisearch:7700
      COSING_API_BASE: https://cosingchecker.com/api/v1
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  meilidata:
